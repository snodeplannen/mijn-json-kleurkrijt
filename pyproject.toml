[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.10.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colored_json"
version = "0.9.0"
description = "Razendsnelle gekleurde JSON/dict printer"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Jouw Naam"}
]
dependencies = [
    "pybind11>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
]

[tool.setuptools]
packages = []

[tool.setuptools.package-data]
"*" = ["*.hpp", "*.cpp", "*.pyi"]

[[tool.mypy.overrides]]
module = ["pybind11.*"]
follow_untyped_imports = true

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32"
before-build = "git submodule update --init --recursive || true"
test-command = "python -c \"import colored_json; print(colored_json.Style.list_presets())\""